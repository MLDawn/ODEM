priors:
  theta:
    ####### Lorenz priors ######
##  ##########################################
    #coefficient of variation std/expectation
    gt: [28.0] # the rho parameter
    E_theta: [30.0] # was 30
    sigma_theta: [9] # was 9

#    ##    ###### GLV priors #####
#    #    ##########################################
#    gt: [0.2, -0.4, 0.1]
#    E_theta: [[0.3, -0.2, 0.3]]
#    sigma_theta: [[0.25, 0.25, 0.25]]

  lambda:
    # Below we define expected precisions in the precision space and define std in lambda space.
    # Expected value in the lambda space shall be calculated in the code
    E_pi_x: [500] # expected noise precision
    sigma_lambda_x: [0.1, 0.5] # standard deviation for the lambda prior

    E_pi_y: [10.0, 20.0, 50.0, 500, 5000, 12500, 25000] # --> results in C=[1/50, 1/25, 1/10, 1, 10, 25, 50]
    sigma_lambda_y: [0.1, 0.5]

optimizer:
  # Carry covariance during the E and M steps
  # Even if E_step_flag: False, we wil carry the same covariance since the mode, q_theta, does not change
  carry_cov: True
  x:
    name: 'ozaki' # 'sgd', 'ozaki' for D step
    nu: [-4] # used to be include -1 as well. ONLY ozaki: according to the VL paper, the default starting value is -4

    kappa_x: [ 1.0, 0.5, 0.25 ] # BOTH ozaki and sgd: Controls the effect of gradients in D step for both sgd and ozaki

  lambda:
    adapt: True # Adapt learning rate as a function of time
    eta: # If fixed: False, then Robins-Monroe kicks in, below
      rate: 0.0001
      t_0: 10
      gamma: 0.3

    inter: 1
    beta: [ 0, 0.1, 0.2 ] # Exponential smoothing if 0, then no memory

  theta:
    adapt: True # adapting the learning rate through Robbins-Monro
    eta:
      rate: 0.0001
      t_0: 10
      gamma: 0.3

    inter: [64, 128, 256, 512]
    beta: [ 0, 0.1, 0.2 ] # Exponential smoothing if 0, then no memory

  jitter: 1e-6 # Initial jitter value when dealing with non-positive definite Hessian of the joints in compute_covariance_posteriors.py

# Generative Process
gp:
  # state noise
  noise:
    x_wn_mu: 0.0
    x_wn_sigma: [ [ 0.05, 0.05, "linear" ] ]
    #These two will only take effect of noise_type=color
    x_cn_kernel_size: 51 #should be an odd number
    x_cn_kernel_sigma: 0.005 # used to be 0.05 smaller than dt (if too small--> numerical instability). Different to y noise smoothness

  #Name of the Generative Process (GP):
  name: 'glv'
  #The time step used for solving the ODEs in GP
  dt: 0.1
  # Total time used to solve the ODEs in the GP
  T: 10 # [For mean-fields this is in ms]

gm:
  #The Flow Function for the State Dynamics Equation: ['lorenz', 'glv']
  dynamics: 'lorenz'
  #The Flow Function for the Observation Model, g(): 'identity'
  likelihood: 'identity' #'identity'
  #Number of Generalised Coordinates (GPs) in x and y
  # kx=2 means we have x and x' (and not higher temporal derivatives x'',x''', etc.)
  # ky=1 means we have y (and not higher temporal derivatives y',y'', etc.)
  # IF you decide to increase the values to get into the generalised coordinates of motion, make sure that:
  # kx=ky+1 always holds!

  # Plus 1 the degree of non-linearity of the assumed GP
  kx: 2
  ky: 1

  # Observation noise characteristics
  noise:
    #Noise parameters for the White Noise (The same white noise will be used for
    #generating colored noise through convolving a kernel)
    # 'white', 'color' --> Increasing precision of the kernel as convolution continues
    y_wn_mu: 0.0
    y_wn_sigma: [ [ 0.1, 0.1, 'linear' ]]
    #These two will only take effect of noise_type=color
    y_cn_kernel_size: 51 #should be an odd number
    y_cn_kernel_sigma: 0.005 # used to be 0.05 smaller than dt (if too small--> numerical instability)